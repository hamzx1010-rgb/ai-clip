# Render Blueprint — New + → Blueprint → pick this repo (or create a Web Service manually, same settings)
services:
  - type: web
    name: clipforge
    runtime: node
    plan: free
    buildCommand: tar -xzf clipforge.tar.gz && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
